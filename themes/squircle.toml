schema = 1

[meta]
name = "Squircle"
author = "AsvnDG"
source = "https://github.com/ramensoftware/windows-11-taskbar-styling-guide/tree/main/Themes/Squircle"

[[control_styles]]
target = "Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill"
styles = [
    "Fill=Transparent",
]

[[control_styles]]
target = "Taskbar.TaskbarBackground#HoverFlyoutBackgroundControl > Grid > Rectangle#BackgroundFill"
styles = [
    "Fill=#CC222222",
]

[[control_styles]]
target = "Taskbar.TaskListButtonPanel@CommonStates > Grid > Border#BackgroundElement, Taskbar.TaskListButtonPanel@CommonStates > Border#BackgroundElement, SearchUx.SearchUI.SearchButtonRootGrid#SearchBoxButtonRootPanel@CommonStates > Grid > Border#BackgroundElement, SearchUx.SearchUI.SearchButtonRootGrid#SearchBoxButtonRootPanel@CommonStates > Border#BackgroundElement"
styles = [
    "CornerRadius=5",
    "Background:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#BB222222\" />",
    "Background@InactivePointerOver:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#CC222222\" />",
    "Background@ActivePointerOver:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.9\" FallbackColor=\"#CC222222\" />",
    "Background@ActiveNormal:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#CC222222\" />",
    "Background@InactiveNormal:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.7\" FallbackColor=\"#BB222222\" />",
    "Background@InactivePressed:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#CC222222\" />",
    "Background@ActivePressed:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#CC222222\" />",
]

[[control_styles]]
target = "StackPanel#SystemTrayFrameGrid, Grid#SystemTrayFrameGrid"
styles = [
    "Background:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#BB222222\"/>",
    "CornerRadius=5",
    "Margin=0,5,14,5",
    "Padding=10,0,0,0",
]

[[control_styles]]
target = "Rectangle#RunningIndicator"
styles = [
    "Fill=Transparent",
    "RadiusX=5",
    "RadiusY=5",
    "Height=38",
    "Width=40",
]

[[control_styles]]
target = "Grid#IconPanel > TextBlock#LabelControl, Taskbar.TaskListLabeledButtonPanel > TextBlock#LabelControl"
styles = [
    "Margin=4,0,0,0",
    "Foreground=White",
]

[[control_styles]]
target = "Taskbar.SearchBoxButton"
styles = [
    "Foreground=White",
    "Margin=-11,0,0,0",
]

[[control_styles]]
target = "TextBlock#SearchBoxTextBlock"
styles = [
    "FontSize=12",
    "Foreground=White",
]

[[control_styles]]
target = "Rectangle#BackgroundStroke"
styles = [
    "Fill=Transparent",
]

[[control_styles]]
target = "Grid"
styles = [
    "RequestedTheme=2",
]

[[control_styles]]
target = "Taskbar.TaskListButton#TaskListButton[AutomationProperties.Name=Copilot] > Grid#IconPanel > Border#BackgroundElement, Taskbar.TaskListButton#TaskListButton[AutomationProperties.Name=Copilot] > Taskbar.TaskListLabeledButtonPanel#IconPanel > Border#BackgroundElement"
styles = [
    "Background:=<AcrylicBrush TintColor=\"Red\" TintOpacity=\"0.8\" />",
]

[[control_styles]]
target = "Border#BackgroundBorder"
styles = [
    "Margin=0,3,0,3",
    "CornerRadius=5",
]

[[control_styles]]
target = "Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton > Taskbar.TaskListButtonPanel#ExperienceToggleButtonRootPanel > Grid > Border#BackgroundElement@CommonStates, Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton > Taskbar.TaskListButtonPanel#ExperienceToggleButtonRootPanel > Border#BackgroundElement@CommonStates"
styles = [
    "Background@InactivePointerOver:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0\" />",
    "Background:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#BB222222\" />",
]

[[control_styles]]
target = "Border#MultiWindowElement"
styles = [
    "Background:=<AcrylicBrush TintColor=\"Black\" TintOpacity=\"0.8\" FallbackColor=\"#CC222222\" />",
]

[[control_styles]]
target = "TextBlock#TimeInnerTextBlock"
styles = [
    "Foreground=White",
]

[[control_styles]]
target = "TextBlock#DateInnerTextBlock"
styles = [
    "Foreground=White",
]

[[control_styles]]
target = "SystemTray.TextIconContent > Grid > SystemTray.AdaptiveTextBlock#Base > TextBlock"
styles = [
    "Foreground=White",
]

[[control_styles]]
target = "Border#BackgroundElement"
styles = [
    "BorderThickness=0",
]

[[control_styles]]
target = "Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton"
styles = [
    "Margin=-11,0,0,0",
]

[[control_styles]]
target = "Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.Name=Task View]"
styles = [
    "Margin=-12,0,0,0",
]

[[control_styles]]
target = "Grid#IconPanel@RunningIndicatorStates > Border, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Border"
styles = [
    "Background@ActiveRunningIndicator:=<AcrylicBrush TintOpacity=\"0.8\" TintColor=\"Black\" />",
    "Background@InactiveRunningIndicator:=<AcrylicBrush TintOpacity=\"0.8\" TintColor=\"Black\" />",
]

[[control_styles]]
target = "Grid#IconPanel@CommonStates > Border#BackgroundElement, Taskbar.TaskListLabeledButtonPanel@CommonStates > Border#BackgroundElement"
styles = [
    "Background@InactivePointerOver:=<AcrylicBrush TintOpacity=\"0.8\" TintColor=\"Black\" FallbackColor=\"#DD222222\"/>",
    "Background@ActivePointerOver:=<AcrylicBrush TintOpacity=\"0.8\" TintColor=\"Black\" FallbackColor=\"#EE222222\"/>",
    "Background@InactiveNormal:=<AcrylicBrush TintOpacity=\"0.2\" TintColor=\"Black\" FallbackColor=\"#BB222222\"/>",
    "Background@ActiveNormal:=<AcrylicBrush TintOpacity=\"0.8\" TintColor=\"Black\" FallbackColor=\"#CC222222\"/>",
    "Background@ActivePressed:=<AcrylicBrush TintOpacity=\"0.8\" TintColor=\"#333333\" FallbackColor=\"#BB333333\" />",
    "Background@InactivePressed:=<AcrylicBrush TintOpacity=\"0.8\" TintColor=\"#333333\" FallbackColor=\"#BB333333\" />",
    "CornerRadius=5",
    "Margin=1",
]
