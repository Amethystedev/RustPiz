schema = 1
style_constants = [
    "mainRadius = 8",
    "transparent = <SolidColorBrush Color=\"Transparent\"/>",
    "base = <AcrylicBrush TintColor=\"{ThemeResource SystemAltLowColor}\" TintOpacity=\"1\" TintLuminosityOpacity=\"0.7\" FallbackColor=\"{ThemeResource SystemChromeLowColor}\" />",
    "overlay = <AcrylicBrush TintColor=\"{ThemeResource SystemAltLowColor}\" TintOpacity=\"1\" TintLuminosityOpacity=\"0.8\" FallbackColor=\"{ThemeResource CardStrokeColorDefaultSolid}\" />",
    "overlay2 = <AcrylicBrush TintColor=\"{ThemeResource SystemAltLowColor}\" TintOpacity=\"1\" TintLuminosityOpacity=\"0.5\" FallbackColor=\"{ThemeResource CardStrokeColorDefaultSolid}\" />",
    "accentColor = <SolidColorBrush Color=\"{ThemeResource SystemAccentColor}\" Opacity = \"1\" />",
    "inverseBW = <SolidColorBrush Color=\"{ThemeResource SystemBaseHighColor}\" Opacity = \"1\" />",
    "active = <AcrylicBrush TintColor=\"{ThemeResource SystemAltLowColor}\" TintOpacity=\"1\" TintLuminosityOpacity=\"1\" FallbackColor=\"{ThemeResource CardStrokeColorDefaultSolid}\" />",
]

[meta]
name = "Matter"
author = "ZoraizLajwer"
source = "https://github.com/ramensoftware/windows-11-taskbar-styling-guide/tree/main/Themes/Matter"

[[control_styles]]
target = "Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill"
styles = [
    "Fill := $transparent",
]

[[control_styles]]
target = "Rectangle#BackgroundStroke"
styles = [
    "Fill := $transparent",
]

[[control_styles]]
target = "Taskbar.TaskbarBackground#HoverFlyoutBackgroundControl"
styles = [
    "Fill:=$base",
    "CornerRadius = $mainRadius",
]

[[control_styles]]
target = "Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton"
styles = [
    "Margin=-1,1,1,1",
]

[[control_styles]]
target = "Taskbar.TaskListButtonPanel@CommonStates > Grid > Border#BackgroundElement, Taskbar.TaskListButtonPanel@CommonStates > Border#BackgroundElement"
styles = [
    "CornerRadius = $mainRadius",
    "Background :=$base",
    "Background@InactivePointerOver :=$overlay2",
    "Background@ActivePointerOver:=$overlay",
    "Background@ActiveNormal :=$active",
]

[[control_styles]]
target = "Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.Name=Task View]"
styles = [
    "Margin=0,0,2,0",
]

[[control_styles]]
target = "Taskbar.TaskListButton#TaskListButton[AutomationProperties.Name=Copilot] > Grid#IconPanel > Border#BackgroundElement, Taskbar.TaskListButton#TaskListButton[AutomationProperties.Name=Copilot] > Taskbar.TaskListLabeledButtonPanel#IconPanel > Border#BackgroundElement"
styles = [
    "Visibility = 1",
]

[[control_styles]]
target = "Taskbar.SearchBoxButton"
styles = [
    "Margin=0,0,2,0",
]

[[control_styles]]
target = "SearchUx.SearchUI.SearchButtonControl"
styles = [
    "Margin=0,0,2,0",
]

[[control_styles]]
target = "Border#BackgroundElement"
styles = [
    "BorderThickness=0",
]

[[control_styles]]
target = "Grid#IconPanel@CommonStates > Border#BackgroundElement, Taskbar.TaskListLabeledButtonPanel@CommonStates > Border#BackgroundElement"
styles = [
    "Background@InactiveNormal :=$base",
    "Background@ActiveNormal :=$active",
    "Background@InactivePointerOver :=$overlay2",
    "Background@ActivePointerOver:=$overlay",
    "CornerRadius = $mainRadius",
    "Margin = 1,0,1,0",
    "Background@MultiWindowNormal:=$base",
    "Background@MultiWindowPointerOver:=$overlay2",
    "Background@MultiWindowActive:=$active",
    "Background@MultiWindowPressed:=$overlay",
]

[[control_styles]]
target = "Border#MultiWindowElement"
styles = [
    "CornerRadius = $mainRadius",
    "Padding = 7,0,8,0",
    "Background :=$accentColor",
]

[[control_styles]]
target = "Grid#IconPanel > TextBlock#LabelControl, Taskbar.TaskListLabeledButtonPanel > TextBlock#LabelControl"
styles = [
    "Margin=0,0,2,0",
]

[[control_styles]]
target = "Grid#IconPanel@RunningIndicatorStates > Rectangle#RunningIndicator, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Rectangle#RunningIndicator"
styles = [
    "Fill := $inverseBW",
    "RadiusX=1.5",
    "RadiusY=1.5",
    "Height=4",
    "Width=12",
    "Fill@ActiveRunningIndicator :=$accentColor",
    "Width@ActiveRunningIndicator=21",
]

[[control_styles]]
target = "StackPanel#SystemTrayFrameGrid, Grid#SystemTrayFrameGrid"
styles = [
    "Background:=$base",
    "CornerRadius = $mainRadius",
    "Margin=0,5,12,5",
    "Padding=5,0,0,0",
]

[[control_styles]]
target = "Border#BackgroundBorder"
styles = [
    "Margin=2,5,2,5",
    "CornerRadius=8",
    "BorderThickness = 0",
]

[[control_styles]]
target = "Grid#OverflowRootGrid > Border"
styles = [
    "Background:=$base",
    "Shadow :=",
    "CornerRadius = 14",
]

[[control_styles]]
target = "Windows.UI.Xaml.Shapes.Rectangle#HorizontalTrackRect"
styles = [
    "Height = 8",
    "Margin = 0",
    "Fill := $overlay",
]

[[control_styles]]
target = "Windows.UI.Xaml.Shapes.Rectangle#HorizontalDecreaseRect"
styles = [
    "Height = 8",
]

[[control_styles]]
target = "Windows.UI.Xaml.Controls.TextBlock#volumeLevelText"
styles = [
    "FontFamily = Tektur",
    "Margin = 0,-2,0,0",
]

[[control_styles]]
target = "Windows.UI.Xaml.Controls.Grid#VolumeConfirmator"
styles = [
    "Padding = 8,0,3,0",
    "CornerRadius = 20",
]

[[control_styles]]
target = "Windows.UI.Xaml.Controls.Grid#ConfirmatorMainGrid"
styles = [
    "Background :=$base",
    "CornerRadius = 14",
    "BorderThickness = 0",
    "Margin = 0,0,0,10",
    "Shadow :=",
]

[[control_styles]]
target = "Windows.UI.Xaml.Controls.Grid#BrightnessConfirmator"
styles = [
    "Padding = 15,0,17,0",
    "CornerRadius = 20",
]

[[control_styles]]
target = "Microsoft.UI.Xaml.Controls.AnimatedIcon#BrightnessIcon"
styles = [
    "Margin = 0,-1,12,0",
]

[[control_styles]]
target = "Microsoft.UI.Xaml.Controls.ProgressBar#ProgressIndicator"
styles = [
    "Margin = 0,0,0,1",
]

[[control_styles]]
target = "Windows.UI.Xaml.Shapes.Rectangle#ProgressBarTrack"
styles = [
    "Fill := $inverseBW",
    "RadiusX = 1.5",
    "RadiusY = 1.5",
]

[[control_styles]]
target = "Windows.UI.Xaml.Shapes.Rectangle#DeterminateProgressBarIndicator"
styles = [
    "Fill :=$accentColor",
]

[[control_styles]]
target = "Taskbar.TaskListButton#TaskListButton > Grid#IconPanel > Microsoft.UI.Xaml.Controls.ProgressBar#ProgressIndicator, Taskbar.TaskListButton#TaskListButton > Taskbar.TaskListLabeledButtonPanel#IconPanel > Microsoft.UI.Xaml.Controls.ProgressBar#ProgressIndicator"
styles = [
    "MinHeight = 4",
    "Width = 26",
]

[[control_styles]]
target = "Windows.UI.Xaml.Controls.ContentPresenter#ContentPresenter"
styles = [
    "BorderThickness = 0",
]

[[control_styles]]
target = "Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.Name=Start]"
styles = [
    "Margin = 0,0,2,0",
]

[[control_styles]]
target = "Taskbar.Badge#BadgeControl"
styles = [
    "Height = 14",
    "MinWidth = 14",
    "Margin = 0,0,0,0",
    "CornerRadius = 20",
]

[[control_styles]]
target = "Taskbar.Badge > Grid > Windows.UI.Xaml.Shapes.Rectangle#BackgroundRect"
styles = [
    "RadiusX = 4",
    "RadiusY = 4",
]

[[control_styles]]
target = "MenuFlyoutPresenter"
styles = [
    "Background := $base",
    "Shadow :=",
    "CornerRadius = 8",
]

[[control_styles]]
target = "SearchUx.SearchUI.SearchButtonRootGrid@CommonStates > Grid > Border#BackgroundElement, SearchUx.SearchUI.SearchButtonRootGrid@CommonStates > Border#BackgroundElement"
styles = [
    "Background@InactiveNormal :=$base",
    "CornerRadius = $mainRadius",
    "Background :=$base",
    "Background@InactivePointerOver :=$overlay2",
    "Background@ActivePointerOver:=$overlay",
    "Background@ActiveNormal :=$active",
]
