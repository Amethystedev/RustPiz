schema = 1

[meta]
name = "TaskbarToStatusbar"
author = "HTImen"
source = "https://github.com/ramensoftware/windows-11-taskbar-styling-guide/tree/main/Themes/TaskbarToStatusbar"

[[control_styles]]
target = "Taskbar.TaskbarFrame > Grid#RootGrid > Microsoft.UI.Xaml.Controls.ItemsRepeater#TaskbarFrameRepeater"
styles = [
    "Width=Auto",
    "HorizontalAlignment=Left",
]

[[control_styles]]
target = "Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=TaskViewButton] > Taskbar.TaskListButtonPanel#ExperienceToggleButtonRootPanel"
styles = [
    "Width=3840",
    "Margin=0,0,-3840,0",
]

[[control_styles]]
target = "Taskbar.ExperienceToggleButton#LaunchListButton > Taskbar.TaskListButtonPanel > Grid > Microsoft.UI.Xaml.Controls.AnimatedVisualPlayer#Icon, Taskbar.ExperienceToggleButton#LaunchListButton > Taskbar.TaskListButtonPanel > Microsoft.UI.Xaml.Controls.AnimatedVisualPlayer#Icon"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "Taskbar.TaskListButtonPanel@CommonStates > Grid > Border#BackgroundElement, Taskbar.TaskListButtonPanel@CommonStates > Border#BackgroundElement"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "Taskbar.SearchBoxButton#SearchBoxButton[AutomationProperties.AutomationId=SearchButton] > Taskbar.TaskListButtonPanel"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "Taskbar.TaskbarExtensionElement"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "Grid#IconPanel, Taskbar.TaskListLabeledButtonPanel#IconPanel"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "Taskbar.TaskListButtonPanel#OverflowToggleButtonRootPanel"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "SystemTray.SystemTrayFrame"
styles = [
    "HorizontalAlignment=Center",
]

[[control_styles]]
target = "SystemTray.Stack#ShowDesktopStack"
styles = [
    "Width=1920",
    "Margin=0,0,-1920,0",
]

[[control_styles]]
target = "SystemTray.StackListView#IconStack[AutomationProperties.AutomationId=ShowDesktop] > ItemsPresenter > StackPanel > ContentPresenter > SystemTray.IconView#SystemTrayIcon > Grid#ContainerGrid, SystemTray.StackListView#IconStack[AutomationProperties.AutomationId=ShowDesktop] > ItemsPresenter > StackPanel > ContentPresenter > SystemTray.IconView#SystemTrayIcon"
styles = [
    "Width=1920",
]

[[control_styles]]
target = "SystemTray.IconView#SystemTrayIcon > Grid#ContainerGrid@ > Rectangle#ShowDesktopPipe"
styles = [
    "Fill=Transparent",
]

[[control_styles]]
target = "SystemTray.OmniButton#ControlCenterButton > Grid > ContentPresenter > ItemsPresenter > StackPanel > ContentPresenter > SystemTray.IconView#SystemTrayIcon > Grid#ContainerGrid"
styles = [
    "Padding=4,0,4,0",
]

[[control_styles]]
target = "SystemTray.OmniButton#NotificationCenterButton > Grid > ContentPresenter > ItemsPresenter > StackPanel > ContentPresenter > SystemTray.IconView#SystemTrayIcon > Grid#ContainerGrid"
styles = [
    "Padding=4,0,4,0",
]

[[control_styles]]
target = "SystemTray.AdaptiveTextBlock#LanguageInnerTextBlock > Windows.UI.Xaml.Controls.TextBlock#InnerTextBlock"
styles = [
    "TextTrimming=1",
    "Height=20",
    "FontSize=14",
]

[[control_styles]]
target = "TextBlock#BatteryTextBlock"
styles = [
    "FontSize=14",
]

[[control_styles]]
target = "TextBlock#TimeInnerTextBlock"
styles = [
    "FontSize=14",
]

[[control_styles]]
target = "TextBlock#DateInnerTextBlock"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "StackPanel#SystemTrayFrameGrid, Grid#SystemTrayFrameGrid"
styles = [
    "Margin=0,-4,0,-4",
    "Opacity=0.75",
]

[[control_styles]]
target = "Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundStroke"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill"
styles = [
    "Fill:=<SolidColorBrush Color=\"{ThemeResource TextFillColorInverse}\"  Opacity=\"1.0\" />",
]

[[control_styles]]
target = "Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid"
styles = [
    "Background=Black",
]
