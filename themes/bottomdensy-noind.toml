schema = 1
style_constants = [
    "volume_bar_width_outer_152=132",
    "volume_bar_width_inner_110=90",
]

[meta]
name = "BottomDensy (NoInd)"
author = "es"
source = "https://github.com/ramensoftware/windows-11-taskbar-styling-guide/tree/main/Themes/BottomDensy"

[[control_styles]]
target = "Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill"
styles = [
    "Fill=Transparent",
]

[[control_styles]]
target = "Rectangle#BackgroundStroke"
styles = [
    "Fill=Transparent",
]

[[control_styles]]
target = "Grid#IconPanel@RunningIndicatorStates > Rectangle#RunningIndicator, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Rectangle#RunningIndicator"
styles = [
    "Fill=#8f8f8f",
    "Fill@ActiveRunningIndicator=#fef9f0",
    "Width=0",
    "Height=0",
    "Margin=0,0,0,0",
    "Width@ActiveRunningIndicator=32",
    "Height@ActiveRunningIndicator=2",
    "Margin@ActiveRunningIndicator=0,-2,0,0",
]

[[control_styles]]
target = "Grid#IconPanel@RunningIndicatorStates > Microsoft.UI.Xaml.Controls.ProgressBar#ProgressIndicator, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Microsoft.UI.Xaml.Controls.ProgressBar#ProgressIndicator"
styles = [
    "VerticalAlignment=0",
]

[[control_styles]]
target = "Rectangle#RunningIndicator"
styles = [
    "VerticalAlignment=0",
]

[[control_styles]]
target = "Border#ProgressBarRoot"
styles = [
    "VerticalAlignment=0",
]

[[control_styles]]
target = "Rectangle#IndeterminateProgressBarIndicator"
styles = [
    "VerticalAlignment=0",
]

[[control_styles]]
target = "Rectangle#IndeterminateProgressBarIndicator2"
styles = [
    "VerticalAlignment=0",
]

[[control_styles]]
target = "Grid#IconPanel, Taskbar.TaskListLabeledButtonPanel"
styles = [
    "Padding=2,0,2,0",
    "VerticalAlignment=2",
]

[[control_styles]]
target = "Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=StartButton]"
styles = [
    "Visibility=Collapsed",
]

[[control_styles]]
target = "SystemTray.Stack#ShowDesktopStack"
styles = [
    "Width=1",
]

[[control_styles]]
target = "Windows.UI.Xaml.Shapes.Rectangle#ShowDesktopPipe"
styles = [
    "HorizontalAlignment=0",
]

[[control_styles]]
target = "SystemTray.NotificationAreaIcons#NotificationAreaIcons > ItemsPresenter > StackPanel > ContentPresenter > SystemTray.NotifyIconView#NotifyItemIcon > Grid#ContainerGrid > ContentPresenter#ContentPresenter > Grid#ContentGrid > SystemTray.ImageIconContent > Grid#ContainerGrid > Image"
styles = [
    "Width=20",
    "Height=20",
]

[[control_styles]]
target = "WrapGrid > ContentPresenter > SystemTray.NotifyIconView > Grid#ContainerGrid > ContentPresenter#ContentPresenter > Grid#ContentGrid > SystemTray.ImageIconContent > Grid#ContainerGrid > Image"
styles = [
    "Width=20",
    "Height=20",
]

[[control_styles]]
target = "Grid#IconPanel@RunningIndicatorStates > Image#Icon, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Image#Icon"
styles = [
    "Width@ActiveRunningIndicator=30",
    "Height@ActiveRunningIndicator=30",
    "Width@NoRunningIndicator=26",
    "Height@NoRunningIndicator=26",
    "Margin@NoRunningIndicator=0,6,0,0",
]

[[control_styles]]
target = "SystemTray.NotificationAreaOverflow > Grid#OverflowRootGrid"
styles = [
    "Padding=0,0,0,0",
]

[[control_styles]]
target = "SystemTray.NotificationAreaOverflow > Grid#OverflowRootGrid > Border#OverflowFlyoutBackgroundBorder"
styles = [
    "BorderThickness=0,0,0,0",
]

[[control_styles]]
target = "SystemTray.NotificationAreaOverflow > Grid#OverflowRootGrid > ItemsControl"
styles = [
    "Margin=0,0,0,0",
]

[[control_styles]]
target = "SystemSettings.View.RootPage > Grid#RootPageGrid > Grid#RootCommandSearchGrid > SystemSettings.View.SettingsAutoSuggestCommandSearchBox#CommandSearchBox"
styles = [
    "Margin=0,0,0,0",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > SystemTray.NotificationAreaOverflow > Grid#OverflowRootGrid > Border#OverflowFlyoutBackgroundBorder"
styles = [
    "CornerRadius=0",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid"
styles = [
    "BorderThickness=0",
    "CornerRadius=0",
    "MinHeight=32",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid"
styles = [
    "Padding=0,0,0,0",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid > Grid#VolumeConfirmator"
styles = [
    "Padding=0,0,0,0",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid > Grid#VolumeConfirmator > Button"
styles = [
    "Margin=0,0,2,0",
    "Height=16",
    "Width=16",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid"
styles = [
    "MinHeight=16",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid > Grid#VolumeConfirmator > Button > ContentPresenter#ContentPresenter > Microsoft.UI.Xaml.Controls.AnimatedIcon#VolumeIcon"
styles = [
    "Padding=0,0,0,0",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid > Grid#VolumeConfirmator > Slider#volumeSlider > Grid > Grid#SliderContainer > Grid#HorizontalTemplate"
styles = [
    "RowDefinitions:=<RowDefinitionCollection><RowDefinition Height=\"2\"/><RowDefinition Height=\"Auto\"/><RowDefinition Height=\"2\"/></RowDefinitionCollection>",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid > Grid#VolumeConfirmator > TextBlock#volumeLevelText"
styles = [
    "MinWidth=24",
    "Margin=0,0,0,0",
    "VerticalAlignment=1",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas"
styles = [
    "VerticalAlignment=1",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid > Grid#VolumeConfirmator"
styles = [
    "Width:=$volume_bar_width_outer_152",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid > Grid#VolumeConfirmator > Slider#volumeSlider"
styles = [
    "Width:=$volume_bar_width_inner_110",
]

[[control_styles]]
target = "ScrollViewer > ScrollContentPresenter > Border > HWConfirmatorUI.ConfirmatorHostControl > Canvas#ConfirmatorFrameCanvas > Grid > Grid#ConfirmatorMainGrid"
styles = [
    "MaxWidth=4096",
]
